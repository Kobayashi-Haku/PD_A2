<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* 汎用の削除確認モーダル。confirm() の代わりに使用します。
     使い方: data-confirm-target="#confirmDeleteModal" を持つフォームの submit を JS でフックし、
     #confirmDeleteForm に対象フォームの内容をコピーしてから表示します。
     （list.html 側のスクリプトで配線しています） */-->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-exclamation-triangle-fill text-danger"></i> 削除の確認</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" id="confirmDeleteMessage">本当に削除してもよろしいですか？</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteButton">
          <i class="bi bi-trash"></i> 削除する
        </button>
      </div>
    </div>
  </div>
</div>

</body>
</html>

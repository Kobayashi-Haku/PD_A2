<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>食品消費期限管理</title>
  <script>(function(){var t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.setAttribute('data-bs-theme','dark');}})();</script>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <style>
    .status-expired { color: #dc3545; }
    .status-warning { color: #ffc107; }
    .status-ok { color: #198754; }
    .fade-in { animation: fadeIn 0.5s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* テーブルを見やすく */
    .food-table { font-size: 1.1rem; }
    .food-table th { font-size: 1.1rem; font-weight: 600; padding: 15px 12px; }
    .food-table td { padding: 12px; vertical-align: middle; }
    .food-name { font-weight: 500; font-size: 1.15rem; }

    .stat-card { border: none; border-radius: 0.75rem; }
    .stat-card .stat-number { font-size: 2rem; font-weight: 700; }

    .category-badge { font-size: 0.8rem; }

    /* 狭い画面ではテーブルをカード風に積み上げる */
    @media (max-width: 767.98px) {
      .food-table thead { display: none; }
      .food-table, .food-table tbody, .food-table tr, .food-table td { display: block; width: 100%; }
      .food-table tr {
        margin-bottom: 1rem;
        border: 1px solid var(--bs-border-color);
        border-radius: 0.5rem;
        padding: 0.5rem;
      }
      .food-table td {
        text-align: left;
        padding: 0.4rem 0.6rem;
        border: none !important;
      }
      .food-table td.select-col::before { content: ""; }
      .food-table td:not(.select-col)::before {
        content: attr(data-label);
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--bs-secondary-color, #6c757d);
      }
    }
  </style>
</head>
<body class="bg-light">

  <nav th:replace="~{fragments/navbar :: navbar('食品消費期限管理', 'bg-primary', false, true, ${user})}"></nav>

  <div class="container fade-in">

    <!-- ダッシュボード統計カード -->
    <div class="row mb-4 g-3">
      <div class="col-6 col-md-4">
        <div class="card stat-card shadow-sm text-center p-3">
          <i class="bi bi-basket text-primary" style="font-size:1.5rem;"></i>
          <div class="stat-number text-primary" th:text="${totalCount}">0</div>
          <div class="text-muted small">登録食品数</div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="card stat-card shadow-sm text-center p-3">
          <i class="bi bi-clock text-warning" style="font-size:1.5rem;"></i>
          <div class="stat-number text-warning" th:text="${expiringSoonCount}">0</div>
          <div class="text-muted small">期限間近</div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="card stat-card shadow-sm text-center p-3">
          <i class="bi bi-exclamation-triangle text-danger" style="font-size:1.5rem;"></i>
          <div class="stat-number text-danger" th:text="${expiredCount}">0</div>
          <div class="text-muted small">期限切れ</div>
        </div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col d-flex flex-wrap gap-2">
        <a href="/add" class="btn btn-primary">
          <i class="bi bi-plus-circle"></i> 食品を追加
        </a>
        <a href="/recipe/suggest" class="btn btn-success">
          <i class="bi bi-lightbulb"></i> レシピ提案
        </a>
        <a href="/export/csv" class="btn btn-outline-secondary">
          <i class="bi bi-file-earmark-spreadsheet"></i> CSVエクスポート
        </a>
        <button type="button" class="btn btn-outline-danger" id="deleteExpiredBtn">
          <i class="bi bi-trash3"></i> 期限切れを一括削除
        </button>
      </div>
    </div>

    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <strong>エラー:</strong> <span th:text="${param.error[0] == 'limit_reached' ? 'レシピの保存は10件までです。' : 'エラーが発生しました。'}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${param.saved}" class="alert alert-success alert-dismissible fade show" role="alert">
      レシピを保存しました！
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <ul class="nav nav-tabs mb-3" id="myTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="foods-tab" data-bs-toggle="tab" data-bs-target="#foods" type="button" role="tab" aria-controls="foods" aria-selected="true">
          <i class="bi bi-basket"></i> 食品一覧
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="recipes-tab" data-bs-toggle="tab" data-bs-target="#recipes" type="button" role="tab" aria-controls="recipes" aria-selected="false">
          <i class="bi bi-journal-bookmark"></i> お気に入りレシピ
          <span class="badge bg-secondary" th:text="${savedRecipes != null ? savedRecipes.size() : 0}">0</span>
        </button>
      </li>
    </ul>

    <div class="tab-content" id="myTabContent">

      <div class="tab-pane fade show active" id="foods" role="tabpanel" aria-labelledby="foods-tab">

        <!-- 検索・フィルター -->
        <div class="row g-2 mb-3 align-items-center">
          <div class="col-md-5">
            <input type="text" id="foodSearchInput" class="form-control" placeholder="食品名で検索...">
          </div>
          <div class="col-md-7">
            <div class="btn-group flex-wrap" role="group" aria-label="状態フィルター">
              <button type="button" class="btn btn-outline-secondary status-filter-btn active" data-filter="all">すべて</button>
              <button type="button" class="btn btn-outline-success status-filter-btn" data-filter="ok">有効</button>
              <button type="button" class="btn btn-outline-warning status-filter-btn" data-filter="warning">期限間近</button>
              <button type="button" class="btn btn-outline-danger status-filter-btn" data-filter="expired">期限切れ</button>
            </div>
          </div>
        </div>

        <form id="bulkDeleteForm" method="post" th:action="@{/delete/bulk}">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="selectAllCheckbox">
              <label class="form-check-label small text-muted" for="selectAllCheckbox">すべて選択</label>
            </div>
            <button type="button" class="btn btn-sm btn-outline-danger" id="bulkDeleteBtn" disabled>
              <i class="bi bi-trash"></i> 選択した項目を削除
            </button>
          </div>

          <div class="table-responsive">
            <table class="table table-hover food-table">
              <thead class="table-light">
                <tr>
                  <th style="width: 40px;"></th>
                  <th>名称</th>
                  <th>カテゴリ</th>
                  <th>消費期限</th>
                  <th>状態</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="f : ${foods}"
                    th:data-name="${f.name}"
                    th:attr="data-status=${f.expirationDate == null ? 'ok' : (T(java.time.temporal.ChronoUnit).DAYS.between(T(java.time.LocalDate).now(), f.expirationDate) < 0 ? 'expired' : (T(java.time.temporal.ChronoUnit).DAYS.between(T(java.time.LocalDate).now(), f.expirationDate) <= 3 ? 'warning' : 'ok'))}">
                  <td class="select-col">
                    <input type="checkbox" class="form-check-input food-row-checkbox" name="ids" th:value="${f.id}">
                  </td>
                  <td class="food-name" data-label="名称" th:text="${f.name}"></td>
                  <td data-label="カテゴリ">
                    <span class="badge bg-secondary category-badge" th:text="${f.category != null ? f.category.label : 'その他'}"></span>
                  </td>
                  <td class="food-date" data-label="消費期限" th:text="${f.expirationDate != null ? f.expirationDate : '未設定'}"></td>
                  <td data-label="状態">
                    <th:block th:if="${f.expirationDate != null}">
                      <span th:with="days=${T(java.time.temporal.ChronoUnit).DAYS.between(T(java.time.LocalDate).now(), f.expirationDate)}"
                            th:class="${days < 0 ? 'status-expired status-badge' : (days <= 3 ? 'status-warning status-badge' : 'status-ok status-badge')}">
                        <span th:if="${days < 0}">
                          <i class="bi bi-exclamation-triangle-fill"></i> 期限切れ
                        </span>
                        <span th:if="${days <= 3 && days >= 0}">
                          <i class="bi bi-clock"></i> 間近（残り<span th:text="${days}"></span>日）
                        </span>
                        <span th:if="${days > 3}">
                          <i class="bi bi-check-circle"></i> 有効（残り<span th:text="${days}"></span>日）
                        </span>
                      </span>
                    </th:block>
                    <th:block th:unless="${f.expirationDate != null}">
                      <span class="badge bg-secondary">日付未設定</span>
                    </th:block>
                  </td>
                  <td data-label="操作">
                    <a th:href="@{/edit/{id}(id=${f.id})}" class="btn btn-warning btn-sm me-2">
                      <i class="bi bi-pencil"></i> 編集
                    </a>
                    <form method="post" th:action="@{/delete}" class="d-inline single-delete-form">
                      <input type="hidden" name="id" th:value="${f.id}" />
                      <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-trash"></i> 削除
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
            <div th:if="${foods == null || foods.isEmpty()}" class="text-center py-5">
              <p class="text-muted">登録された食品はありません。</p>
            </div>
            <div id="noResultsMessage" class="text-center py-5" style="display:none;">
              <p class="text-muted">条件に一致する食品が見つかりません。</p>
            </div>
          </div>
        </form>
      </div>

      <div class="tab-pane fade" id="recipes" role="tabpanel" aria-labelledby="recipes-tab">
        <div th:if="${savedRecipes == null || savedRecipes.isEmpty()}" class="text-center py-5 text-muted">
          <i class="bi bi-journal-x" style="font-size: 2rem;"></i>
          <p class="mt-2">保存されたレシピはありません</p>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3" th:each="recipe : ${savedRecipes}">
            <div class="card h-100">
              <div class="card-header d-flex justify-content-between align-items-center">
                <h6 class="mb-0 fw-bold" th:text="${recipe.title}">料理名</h6>
                <form method="post" th:action="@{/recipe/delete}" class="single-delete-form">
                  <input type="hidden" name="id" th:value="${recipe.id}">
                  <button type="submit" class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </div>
              <div class="card-body">
                <p class="small text-muted mb-2">
                  <i class="bi bi-clock"></i> <span th:text="${recipe.cookingTime}"></span> /
                  <i class="bi bi-bar-chart"></i> <span th:text="${recipe.difficulty}"></span>
                </p>
                <button class="btn btn-sm btn-outline-primary w-100 mb-2" type="button"
                        data-bs-toggle="collapse"
                        th:data-bs-target="'#collapse-' + ${recipe.id}"
                        aria-expanded="false">
                  詳細を見る <i class="bi bi-chevron-down"></i>
                </button>
                <div class="collapse" th:id="'collapse-' + ${recipe.id}">
                  <div class="card card-body bg-light mt-2">
                    <strong><i class="bi bi-basket"></i> 材料:</strong>
                    <p class="small mb-2" th:text="${recipe.ingredients}">データなし</p>
                    <strong><i class="bi bi-list-ol"></i> 作り方:</strong>
                    <p class="small mb-0" th:text="${recipe.instructions}" style="white-space: pre-wrap;">データなし</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div th:replace="~{fragments/confirm-modal :: confirm-modal}"></div>
  <div th:replace="~{fragments/toast :: toast}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <th:block th:replace="~{fragments/navbar :: darkmode-script}"></th:block>
  <th:block th:replace="~{fragments/toast :: toast-script}"></th:block>

  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
      // URLパラメータによるタブ切り替え
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('tab') === 'recipes') {
        const triggerEl = document.querySelector('#recipes-tab');
        const tab = new bootstrap.Tab(triggerEl);
        tab.show();
      }

      // --- 検索・フィルター ---
      const searchInput = document.getElementById('foodSearchInput');
      const filterButtons = document.querySelectorAll('.status-filter-btn');
      const rows = document.querySelectorAll('#foods tbody tr');
      const noResultsMessage = document.getElementById('noResultsMessage');
      let currentStatusFilter = 'all';

      function applyFilters() {
        const keyword = (searchInput.value || '').trim().toLowerCase();
        let visibleCount = 0;
        rows.forEach(function(row) {
          const name = (row.getAttribute('data-name') || '').toLowerCase();
          const status = row.getAttribute('data-status');
          const matchesKeyword = name.includes(keyword);
          const matchesStatus = currentStatusFilter === 'all' || status === currentStatusFilter;
          const visible = matchesKeyword && matchesStatus;
          row.style.display = visible ? '' : 'none';
          if (visible) visibleCount++;
        });
        if (noResultsMessage) {
          noResultsMessage.style.display = (visibleCount === 0 && rows.length > 0) ? 'block' : 'none';
        }
      }

      if (searchInput) {
        searchInput.addEventListener('input', applyFilters);
      }
      filterButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          filterButtons.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentStatusFilter = btn.getAttribute('data-filter');
          applyFilters();
        });
      });

      // --- 一括選択・一括削除 ---
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');
      const rowCheckboxes = document.querySelectorAll('.food-row-checkbox');
      const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
      const bulkDeleteForm = document.getElementById('bulkDeleteForm');

      function updateBulkButtonState() {
        const anyChecked = Array.from(rowCheckboxes).some(cb => cb.checked);
        if (bulkDeleteBtn) bulkDeleteBtn.disabled = !anyChecked;
      }

      if (selectAllCheckbox) {
        selectAllCheckbox.addEventListener('change', function() {
          rowCheckboxes.forEach(cb => { cb.checked = selectAllCheckbox.checked; });
          updateBulkButtonState();
        });
      }
      rowCheckboxes.forEach(cb => cb.addEventListener('change', updateBulkButtonState));

      // --- 削除確認モーダル ---
      const confirmModalEl = document.getElementById('confirmDeleteModal');
      const confirmModal = confirmModalEl ? new bootstrap.Modal(confirmModalEl) : null;
      const confirmMessage = document.getElementById('confirmDeleteMessage');
      const confirmButton = document.getElementById('confirmDeleteButton');
      let pendingAction = null;

      function askConfirm(message, onConfirm) {
        if (!confirmModal) { onConfirm(); return; }
        confirmMessage.textContent = message;
        pendingAction = onConfirm;
        confirmModal.show();
      }

      if (confirmButton) {
        confirmButton.addEventListener('click', function() {
          if (confirmModal) confirmModal.hide();
          if (pendingAction) {
            const action = pendingAction;
            pendingAction = null;
            action();
          }
        });
      }

      // 食品削除・レシピ削除フォーム（個別）
      document.querySelectorAll('.single-delete-form').forEach(function(form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          askConfirm('本当に削除してもよろしいですか？', function() { form.submit(); });
        });
      });

      // 一括削除ボタン
      if (bulkDeleteBtn) {
        bulkDeleteBtn.addEventListener('click', function() {
          askConfirm('選択した食品をまとめて削除します。よろしいですか？', function() { bulkDeleteForm.submit(); });
        });
      }

      // 期限切れ一括削除
      const deleteExpiredBtn = document.getElementById('deleteExpiredBtn');
      if (deleteExpiredBtn) {
        deleteExpiredBtn.addEventListener('click', function() {
          askConfirm('期限切れの食品をすべて削除します。よろしいですか？', function() {
            const form = document.createElement('form');
            form.method = 'post';
            form.action = /*[[@{/delete/expired}]]*/ '/delete/expired';

            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeaderName = document.querySelector('meta[name="_csrf_header"]')?.content;
            if (csrfToken && csrfHeaderName) {
              const input = document.createElement('input');
              input.type = 'hidden';
              // ヘッダー名はCookie/フォーム送信では使わずパラメータ名 _csrf を使う
              input.name = '_csrf';
              input.value = csrfToken;
              form.appendChild(input);
            }
            document.body.appendChild(form);
            form.submit();
          });
        });
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>食品追加</title>
  <script>(function(){var t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.setAttribute('data-bs-theme','dark');}})();</script>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="icon" type="image/svg+xml" sizes="16x16" th:href="@{/favicon-16x16.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <style>
    .fade-in { animation: fadeIn 0.5s; }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    input[type="date"] {
      position: relative;
      height: 50px;
      font-size: 1.2rem;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-light">
  <nav th:replace="~{fragments/navbar :: navbar('食品消費期限管理', 'bg-primary', true, false, null)}"></nav>

  <div class="container fade-in">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header">
            <h5 class="card-title mb-0">食品を追加</h5>
          </div>
          <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${param.error}" class="alert alert-danger">
              <span th:if="${param.error[0] == 'past_date'}">過去の日付は登録できません。</span>
              <span th:unless="${param.error[0] == 'past_date'}">エラーが発生しました。</span>
            </div>
            <form method="post" th:action="@{/add}">
              <div class="mb-3">
                <label for="name" class="form-label">名称</label>
                <input type="text" class="form-control" id="name" name="name" required
                       th:value="${food != null ? food.name : ''}"
                       placeholder="食品名を入力してください">
              </div>
              <div class="mb-3">
                <label for="expirationDate" class="form-label">消費期限</label>
                <input type="date" class="form-control" id="expirationDate"
                       name="expirationDate" required
                       th:value="${food != null ? food.expirationDate : ''}"
                       th:min="${#temporals.format(T(java.time.LocalDate).now(), 'yyyy-MM-dd')}">
              </div>
              <div class="mb-3">
                <label for="category" class="form-label">カテゴリ</label>
                <select class="form-select" id="category" name="category">
                  <option th:each="c : ${categories}"
                          th:value="${c}"
                          th:text="${c.label}"
                          th:selected="${food != null && food.category == c}"></option>
                </select>
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-plus-circle"></i> 追加
                </button>
                <a href="/" class="btn btn-outline-secondary">
                  <i class="bi bi-arrow-left"></i> 一覧に戻る
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <th:block th:replace="~{fragments/navbar :: darkmode-script}"></th:block>
</body>
</html>

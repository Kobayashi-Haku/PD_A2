<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>食品追加</title>
  <script>(function(){var t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.setAttribute('data-bs-theme','dark');}})();</script>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="icon" type="image/svg+xml" sizes="16x16" th:href="@{/favicon-16x16.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <style>
    body { background: #f0fdf4; }
    .fade-in { animation: fadeIn 0.45s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .form-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(22,163,74,0.10);
      overflow: hidden;
    }
    .form-card-header {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: white;
      padding: 1.5rem 1.75rem;
    }
    .form-card-header h5 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
    }
    .form-card-header .header-icon {
      font-size: 2rem;
      opacity: 0.85;
    }
    .form-card .card-body {
      padding: 2rem 1.75rem;
    }
    .form-label {
      font-weight: 600;
      font-size: 0.875rem;
      color: #374151;
      margin-bottom: 0.4rem;
    }
    .form-control, .form-select {
      border-radius: 10px;
      border: 1.5px solid #d1fae5;
      padding: 0.65rem 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus, .form-select:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22,163,74,0.12);
    }
    input[type="date"] {
      position: relative;
      height: 50px;
      font-size: 1rem;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }
    .btn-submit {
      background: linear-gradient(135deg, #16a34a, #15803d);
      border: none; color: white; font-weight: 700;
      border-radius: 12px; padding: 0.7rem 1rem;
      box-shadow: 0 4px 14px rgba(22,163,74,0.28);
      transition: all 0.2s;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(22,163,74,0.38); color: white; }
    .btn-back {
      border: 2px solid #d1fae5; color: #16a34a; font-weight: 600;
      border-radius: 12px; padding: 0.65rem 1rem;
      background: transparent; transition: all 0.2s;
    }
    .btn-back:hover { background: #f0fdf4; color: #15803d; }

    [data-bs-theme="dark"] body { background: #0f172a; }
    [data-bs-theme="dark"] .form-card { background: #1e293b; }
    [data-bs-theme="dark"] .form-label { color: #cbd5e1; }
    [data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select {
      background: #0f172a; border-color: #334155; color: #f1f5f9;
    }
    [data-bs-theme="dark"] .btn-back { border-color: #334155; color: #86efac; }
    [data-bs-theme="dark"] .btn-back:hover { background: #14532d; }
  </style>
</head>
<body>
  <nav th:replace="~{fragments/navbar :: navbar('食品消費期限管理', 'bg-primary', true, false, null)}"></nav>

  <div class="container fade-in">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="form-card card">
          <div class="form-card-header d-flex justify-content-between align-items-center">
            <h5><i class="bi bi-plus-circle-fill me-2"></i>食品を追加</h5>
            <span class="header-icon">🥦</span>
          </div>
          <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" style="border-radius: 10px;" th:text="${error}"></div>
            <div th:if="${param.error}" class="alert alert-danger" style="border-radius: 10px;">
              <i class="bi bi-exclamation-circle me-1"></i>
              <span th:if="${param.error[0] == 'past_date'}">過去の日付は登録できません。</span>
              <span th:unless="${param.error[0] == 'past_date'}">エラーが発生しました。</span>
            </div>
            <form method="post" th:action="@{/add}">
              <div class="mb-3">
                <label for="name" class="form-label">名称</label>
                <input type="text" class="form-control" id="name" name="name" required
                       th:value="${food != null ? food.name : ''}"
                       placeholder="食品名を入力してください">
              </div>
              <div class="mb-3">
                <label for="expirationDate" class="form-label">消費期限</label>
                <input type="date" class="form-control" id="expirationDate"
                       name="expirationDate" required
                       th:value="${food != null ? food.expirationDate : ''}"
                       th:min="${today}">
              </div>
              <div class="mb-4">
                <label for="category" class="form-label">カテゴリ</label>
                <select class="form-select" id="category" name="category">
                  <option th:each="c : ${categories}"
                          th:value="${c}"
                          th:text="${c.label}"
                          th:selected="${food != null && food.category == c}"></option>
                </select>
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-submit">
                  <i class="bi bi-plus-circle-fill me-1"></i> 追加する
                </button>
                <a href="/" class="btn btn-back text-center">
                  <i class="bi bi-arrow-left me-1"></i> 一覧に戻る
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <th:block th:replace="~{fragments/navbar :: darkmode-script}"></th:block>
</body>
</html>
